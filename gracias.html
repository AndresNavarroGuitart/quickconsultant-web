  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #e91e8c; --purple: #7b2d8b;
      --grad: linear-gradient(135deg, #e91e8c 0%, #7b2d8b 100%);
      --dark: #111118; --text: #1a1a2e; --muted: #6b7280;
      --white: #ffffff;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--white); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
    .grad-text { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #ffffff; border-bottom: 2px solid transparent; border-image: var(--grad) 1; box-shadow: 0 2px 24px rgba(0,0,0,0.08); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
    .logo { display: flex; align-items: center; text-decoration: none; }
    .logo img { height: 48px; width: auto; display: block; object-fit: contain; mix-blend-mode: multiply; }
    .btn-nav { background: var(--grad); color: white; padding: 10px 24px; border-radius: 100px; font-weight: 700; font-size: 0.88rem; text-decoration: none; transition: opacity .2s; }
    .btn-nav:hover { opacity: 0.88; }
    /* hero */
    .gracias-hero { flex: 1; display: flex; align-items: center; justify-content: center; padding: 120px 24px 80px; text-align: center; position: relative; overflow: hidden; }
    .gracias-hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(233,30,140,0.06) 0%, rgba(123,45,139,0.06) 100%); }
    .gracias-icon { width: 96px; height: 96px; border-radius: 50%; background: var(--grad); display: flex; align-items: center; justify-content: center; margin: 0 auto 32px; box-shadow: 0 16px 48px rgba(233,30,140,0.35); }
    .gracias-icon svg { width: 48px; height: 48px; fill: none; stroke: white; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .gracias-hero h1 { font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 900; line-height: 1.1; margin-bottom: 20px; }
    .gracias-hero p { font-size: 1.1rem; color: var(--muted); max-width: 480px; margin: 0 auto 40px; line-height: 1.7; }
    .btn-volver { display: inline-flex; align-items: center; gap: 8px; background: var(--grad); color: white; padding: 14px 32px; border-radius: 100px; font-weight: 700; font-size: 1rem; text-decoration: none; transition: opacity .2s, transform .2s; }
    .btn-volver:hover { opacity: 0.88; transform: translateY(-2px); }
    .btn-volver svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    footer { background: #0a0a10; color: rgba(255,255,255,0.5); padding: 40px 0; text-align: center; font-size: 0.85rem; }
  </style>
</head>
